services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Inside the compose network the DB host is the service name
      DATABASE_URL: postgresql+asyncpg://finance:finance@db:5432/finance
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./app
          target: /app/app

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance
      POSTGRES_DB: finance
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Scheduled pg_dump sidecar. Not started by default:
  #   docker compose --profile backup up -d db-backup     # daily loop
  #   docker compose --profile backup run --rm db-backup /scripts/db_backup.sh   # one-shot
  # Restore (see scripts/db_restore.sh):
  #   docker compose --profile backup run --rm db-backup /scripts/db_restore.sh /backups/<file>.dump [db]
  db-backup:
    image: postgres:17-alpine
    profiles: ["backup"]
    environment:
      PGHOST: db
      PGUSER: finance
      PGPASSWORD: finance
      PGDATABASE: finance
      BACKUP_KEEP_DAYS: 14
      BACKUP_INTERVAL_SECONDS: 86400
    volumes:
      - ./backups:/backups
      - ./scripts:/scripts:ro
    depends_on:
      db:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - while true; do /scripts/db_backup.sh; sleep "$${BACKUP_INTERVAL_SECONDS}"; done

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db

volumes:
  pgdata:
  pgadmin_data:
