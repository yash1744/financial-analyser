# Production stack: (edge Caddy on the host, separate compose project) →
# Next.js → FastAPI → Postgres.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# frontend/api are NOT exposed to the host — no ports mapping. They join the
# external `media` Docker network so the host's standalone Caddy (a separate
# compose project, see ~/caddy-compose) can reach them by service name and
# terminate TLS for finance.91.98.89.27.sslip.io. The `media` network must
# already exist (`docker network create media`, or created by the caddy
# stack) before `up` here.
#
# Requires in .env (enforced at boot once ENVIRONMENT != local):
#   ENVIRONMENT=production  JWT_SECRET_KEY=…  TOKEN_ENCRYPTION_KEY=…  PLAID_*
# Apply migrations before first use:
#   docker compose -f docker-compose.prod.yml run --rm api alembic upgrade head

services:
  frontend:
    build: ./frontend
    restart: unless-stopped
    networks:
      - default
      - media

  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://finance:${POSTGRES_PASSWORD:-finance}@db:5432/finance
      ENVIRONMENT: ${ENVIRONMENT:-production}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - media

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finance}
      POSTGRES_DB: finance
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Daily pg_dump into ./backups (see scripts/db_backup.sh), also pushed to
  # R2 when R2_ACCOUNT_ID/R2_ACCESS_KEY_ID/R2_SECRET_ACCESS_KEY/R2_BACKUP_BUCKET
  # are set in .env. Set an R2 bucket lifecycle rule (expire after
  # BACKUP_KEEP_DAYS) to prune remote copies — this service only uploads.
  db-backup:
    build:
      context: deploy
      dockerfile: backup.Dockerfile
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: finance
      PGPASSWORD: ${POSTGRES_PASSWORD:-finance}
      PGDATABASE: finance
      BACKUP_KEEP_DAYS: 14
      BACKUP_INTERVAL_SECONDS: 86400
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BACKUP_BUCKET: ${R2_BACKUP_BUCKET:-}
    volumes:
      - ./backups:/backups
      - ./scripts:/scripts:ro
    depends_on:
      db:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - while true; do /scripts/db_backup.sh; sleep "$${BACKUP_INTERVAL_SECONDS}"; done

networks:
  media:
    external: true

volumes:
  pgdata:
