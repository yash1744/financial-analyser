services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Inside the compose network the DB host is the service name
      DATABASE_URL: postgresql+asyncpg://finance:finance@db:5432/finance
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./app
          target: /app/app

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance
      POSTGRES_DB: finance
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Scheduled pg_dump sidecar. Not started by default:
  #   docker compose --profile backup up -d db-backup     # daily loop
  #   docker compose --profile backup run --rm db-backup /scripts/db_backup.sh   # one-shot
  # Restore (see scripts/db_restore.sh):
  #   docker compose --profile backup run --rm db-backup /scripts/db_restore.sh /backups/<file>.dump [db]
  # Set R2_ACCOUNT_ID/R2_ACCESS_KEY_ID/R2_SECRET_ACCESS_KEY/R2_BACKUP_BUCKET in
  # .env to also test the R2 upload path locally (see scripts/db_backup.sh).
  db-backup:
    build:
      context: deploy
      dockerfile: backup.Dockerfile
    profiles: ["backup"]
    environment:
      PGHOST: db
      PGUSER: finance
      PGPASSWORD: finance
      PGDATABASE: finance
      BACKUP_KEEP_DAYS: 14
      BACKUP_INTERVAL_SECONDS: 86400
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BACKUP_BUCKET: ${R2_BACKUP_BUCKET:-}
    volumes:
      - ./backups:/backups
      - ./scripts:/scripts:ro
    depends_on:
      db:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - while true; do /scripts/db_backup.sh; sleep "$${BACKUP_INTERVAL_SECONDS}"; done

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db

  # Local trace inspection — no Grafana Cloud account needed. Not started
  # by default:
  #   docker compose --profile observability up -d jaeger
  # Then run the API with OTEL_TRACES_EXPORTER=otlp and
  # OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318 (see .env.example),
  # and browse traces at http://localhost:16686.
  jaeger:
    image: jaegertracing/all-in-one:latest
    profiles: ["observability"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # UI
      - "4318:4318" # OTLP HTTP receiver

volumes:
  pgdata:
  pgadmin_data:
